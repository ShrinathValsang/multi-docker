version: '3'
services:
  postgres: 
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=postgres_password # Sets the password for the default PostgreSQL user from env
  redis:
    image: redis:latest
  nginx:
    depends_on:
      - api
      - client
    restart: always
    build:
      dockerfile: Dockerfile.dev
      context: ./nginx
    ports:
      - '3050:80'
  api:
    build: 
      dockerfile: Dockerfile.dev
      context: ./server
    ports:
      - '5000:5000'
    volumes: 
      - /app/node_modules # Prevents overwriting node_modules in the container with the host's empty directory
      - ./server:/app # Mounts the server directory from the host to the container - Copy from ./server to /app in the container
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432
  client:
    environment:
      - WDS_SOCKET_PORT=0
    build:
      dockerfile: Dockerfile.dev
      context: ./client
    volumes:
      - /app/node_modules 
      - ./client:/app
  worker:
    build:
      dockerfile: Dockerfile.dev
      context: ./worker
    volumes:
      - /app/node_modules
      - ./worker:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
